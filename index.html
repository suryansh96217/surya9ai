<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya 9 | Your Cosmic Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars"></div>
    <div class="aurora"></div>

    <div class="glass-container">
        <header>
            <div class="brand">Surya <span>9</span></div>
            <div class="status">● Online</div>
        </header>

        <div id="chat-viewport">
            <div class="msg ai-msg">Hey! I'm Surya 9. How's your day going?</div>
        </div>

        <div class="input-area">
            <input type="text" id="query-input" placeholder="Message Surya 9..." autofocus>
            <button id="send-trigger">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
