<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya 9</title>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="space-bg"></div>
    <div class="stars-layer"></div>
    <div class="aurora"></div>
    <!-- Interstellar Flashes -->
    <div class="flash" style="top: 20%; left: 30%;"></div>
    <div class="flash" style="top: 70%; left: 80%; animation-delay: 3s;"></div>

    <div class="main-viewport">
        <header>
            <div class="logo-group">
                <div class="brand">SURYA <span>9</span></div>
                <div class="logo-line"></div>
            </div>
            <div class="status-tag">● Active</div>
        </header>

        <div id="chat-viewport">
            <div class="msg ai-msg">Surya 9 Ready. How can I assist you?</div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <input type="text" id="query-input" placeholder="Message Surya 9..." autofocus>
                <button id="send-trigger">RUN</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
