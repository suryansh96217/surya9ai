<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya 9 AI | 3.5 Flash Powered</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="brand">SURYA <span class="accent">9</span></div>
            <div class="engine-info">
                <span class="dot"></span> Core: Gemini 3.5 Flash
            </div>
        </header>

        <div id="chat-viewport">
            <div class="msg ai-msg">System initialized. Surya 9 at your command. How can I help you today?</div>
        </div>

        <div class="input-wrapper">
            <input type="text" id="query-input" placeholder="Execute command..." autofocus>
            <button id="send-trigger">RUN</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
