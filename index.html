<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya 9</title>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background System -->
    <div class="space-container">
        <div class="aurora"></div>
        <div class="shooting-star"></div>
    </div>

    <div class="main-viewport">
        <header>
            <div class="logo-wrap">
                <h1 class="brand">SURYA <span>9</span></h1>
                <div class="logo-line"></div>
            </div>
            <div class="active-chip">● ACTIVE</div>
        </header>

        <div id="chat-viewport">
            <!-- AI Welcome Message -->
            <div class="msg ai-msg">Surya 9 Ready. How can I assist you?</div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="query-input" placeholder="Message Surya 9..." autofocus>
                <button id="send-trigger">RUN</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
